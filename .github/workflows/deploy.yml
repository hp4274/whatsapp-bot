name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # 1. CI: Run Server Tests and Verify Frontend Build
  # -------------------------------------------------------------
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install & Run Server Tests
        run: |
          npm --prefix server ci
          npm --prefix server test

      - name: Install & Verify Frontend Build
        run: |
          npm --prefix web ci
          npm --prefix web run build

  # -------------------------------------------------------------
  # 2. CD: Automatic Deployment to VPS
  # -------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Run Deploy Script on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            sudo -u whatsapp bash /var/www/whatsapp-bot/scripts/deploy.sh
