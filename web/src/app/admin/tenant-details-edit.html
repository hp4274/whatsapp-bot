<!-- Tenant settings > left column > Request / Details: the same lines as boxes, edited in place. -->
<form #editForm class="edit" (submit)="$event.preventDefault()" (change)="autoSave(editForm)">
  @if (error()) {
    <p class="s-banner" role="alert"><i class="ti ti-alert-circle" aria-hidden="true"></i>{{ error() }}</p>
  }

  <fieldset>
    <legend>Business</legend>
    <div class="field">
      <label for="ed-name">Business name</label>
      <input id="ed-name" name="name" required maxlength="160" [ngModel]="form().name" (ngModelChange)="set('name', $event)" />
    </div>
    <div class="field">
      <label for="ed-slug">ID <small class="muted">letters, numbers and dashes</small></label>
      <input id="ed-slug" name="slug" required maxlength="80" [ngModel]="form().slug" (ngModelChange)="set('slug', $event)" />
    </div>
    <div class="field">
      <label for="ed-phone">WhatsApp number <small class="muted">where Wuzie writes to them</small></label>
      <app-phone-input
        inputId="ed-phone"
        name="contactPhone"
        [value]="form().contactPhone"
        (valueChange)="set('contactPhone', $event)"
      />
    </div>
    <div class="field">
      <label for="ed-referrer">Referred by</label>
      <app-referrer-input inputId="ed-referrer" [(value)]="referrer" />
    </div>
    <label class="opt">
      <span>Send Wuzie WhatsApp updates <small class="muted">account, plan and payment messages</small></span>
      <button
        type="button"
        role="switch"
        class="switch"
        [attr.aria-checked]="form().wapzoUpdates"
        (click)="set('wapzoUpdates', !form().wapzoUpdates); autoSave(editForm)"
      >
        <span class="thumb"></span>
      </button>
    </label>
  </fieldset>

  <fieldset>
    <legend>Business details</legend>
    <div class="pairs">
      @for (f of profileFields; track f.key) {
        <div class="field" [class.half]="f.half">
          <label [for]="'ed-p-' + f.key">{{ f.label }}</label>
          <input
            [id]="'ed-p-' + f.key"
            [name]="'p-' + f.key"
            [attr.maxlength]="f.max"
            [placeholder]="f.placeholder ?? ''"
            [ngModel]="profile()[f.key]"
            (ngModelChange)="setProfile(f.key, $event)"
          />
        </div>
      }
    </div>
  </fieldset>

  <fieldset>
    <legend>Owner</legend>
    <div class="field">
      <label for="ed-owner">Name</label>
      <input id="ed-owner" name="ownerName" maxlength="120" [ngModel]="form().ownerName" (ngModelChange)="set('ownerName', $event)" />
    </div>
    <div class="field">
      <label for="ed-email">Sign-in email</label>
      <input
        id="ed-email"
        name="ownerEmail"
        type="email"
        maxlength="254"
        [ngModel]="form().ownerEmail"
        (ngModelChange)="set('ownerEmail', $event)"
      />
    </div>
  </fieldset>

  <div class="acts">
    <span class="muted state" role="status">{{ busy() ? 'Saving...' : savedOnce() ? 'Saved' : 'Each box saves when you click away from it.' }}</span>
    <button class="btn" type="button" (click)="cancelled.emit()" [disabled]="busy()">Done</button>
  </div>
</form>
