<div class="picker" role="group" aria-label="Show a conversation for" [segThumb]="scenarioKey()">
  <span class="thumb" aria-hidden="true"></span>
  @for (s of scenarios; track s.key) {
    <button
      type="button"
      [attr.aria-pressed]="scenarioKey() === s.key"
      (click)="scenarioKey.set(s.key)"
    >
      <i class="ti ti-{{ s.icon }}" aria-hidden="true"></i>{{ s.label }}
    </button>
  }
</div>

<figure class="phone" data-ui>
  <!-- WhatsApp's own chat screen: green bar, beige wallpaper, white and green bubbles, the message bar below. -->
  <div class="phone-top">
    <i class="ti ti-arrow-left" aria-hidden="true"></i>
    <span class="avatar" aria-hidden="true">{{ scenario().contact.charAt(0) }}</span>
    <span class="who">
      <strong>{{ scenario().contact }}</strong>
      <small>online</small>
    </span>
    <i class="ti ti-video" aria-hidden="true"></i>
    <i class="ti ti-phone" aria-hidden="true"></i>
  </div>
  <ol class="thread" aria-live="polite">
    <li class="day" aria-hidden="true"><span>Today</span></li>
    @for (line of scenario().lines; track scenario().key + $index; let i = $index) {
      <!-- The tail goes on the first bubble of a run from one side, as WhatsApp draws it. -->
      <li
        class="msg {{ line.side }}"
        [class.first]="i === 0 || scenario().lines[i - 1].side !== line.side"
        [style.--i]="i"
      >
        <span class="text">{{ line.text }}</span>
        <span class="meta">
          {{ line.time }}
          @if (line.side === 'out') {
            <i class="ti ti-checks" aria-label="Read"></i>
          }
        </span>
      </li>
    }
  </ol>
  <div class="composer" aria-hidden="true">
    <span class="field"><i class="ti ti-mood-smile"></i>Message<i class="ti ti-paperclip"></i></span>
    <span class="mic"><i class="ti ti-microphone"></i></span>
  </div>
  <figcaption class="sr-only">
    A sample conversation for a {{ scenario().label.toLowerCase() }}, answered by Wuzie.
  </figcaption>
</figure>
  <p class="auto"><i class="ti ti-message-bolt" aria-hidden="true"></i>Answered by Wuzie's auto-reply</p>
