<!-- A campaign card from the app: header and picker, the template, totals, then the recipients. -->
<div class="picker" role="group" aria-label="Show a bulk campaign for" [segThumb]="key()">
  <span class="thumb" aria-hidden="true"></span>
  @for (x of campaigns; track x.key) {
    <button type="button" [attr.aria-pressed]="key() === x.key" (click)="pick(x.key)">
      <i class="ti ti-{{ x.icon }}" aria-hidden="true"></i>{{ x.label }}
    </button>
  }
</div>

<figure class="card" data-ui>
  <div class="top">
    <span class="title">
      <strong>{{ c().title }}</strong>
      <small>{{ fmt(c().total) }} recipients · one message, personalised</small>
    </span>
    <span class="state">
      <span class="live" [class.done]="done()" role="status">
        <span class="dot"></span>{{ done() ? 'Completed' : 'Sending' }}
      </span>
      @if (done()) {
        <button type="button" class="again" (click)="start()" aria-label="Send this campaign again" title="Send again">
          <i class="ti ti-refresh" aria-hidden="true"></i>
        </button>
      }
    </span>
  </div>

  <div class="compose">
    <!-- One line: template whitespace here would show up as gaps around the fields. -->
    <p>@for (part of parts(); track $index) {<span [class.var]="part.field">{{ part.text }}</span>}</p>
    <span class="attach"><i class="ti ti-{{ c().attachIcon }}" aria-hidden="true"></i>{{ c().attach }}</span>
  </div>

  <div class="bar" role="progressbar" [attr.aria-valuenow]="sent()" aria-valuemin="0" [attr.aria-valuemax]="c().total" aria-label="Sent">
    <span [style.transform]="'scaleX(' + shown() + ')'"></span>
  </div>
  <dl class="kpis">
    <div><dt>Sent</dt><dd>{{ fmt(sent()) }}</dd></div>
    <div><dt>Delivered</dt><dd>{{ fmt(delivered()) }}</dd></div>
    <div><dt>Read</dt><dd>{{ fmt(read()) }}</dd></div>
  </dl>

  <ol class="rows">
    @for (r of c().recipients; track c().key + r.name; let i = $index) {
      <li>
        <span class="av" aria-hidden="true">{{ r.name.charAt(r.name.indexOf(' ') + 1) }}</span>
        <span class="msg">
          <b>{{ r.name }}</b>
          <small>{{ personal(r) }}</small>
        </span>
        <span class="st s{{ state(i) }}">
          <i class="ti ti-{{ states[state(i)].icon }}" aria-hidden="true"></i>{{ states[state(i)].label }}
        </span>
      </li>
    }
  </ol>
  <figcaption class="sr-only">
    A sample bulk campaign, {{ c().title }}, sent to {{ fmt(c().total) }} people with each message personalised.
  </figcaption>
</figure>
