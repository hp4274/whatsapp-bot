@if (done()) {
  <div class="done" role="status">
    <i class="ti ti-circle-check" aria-hidden="true"></i>
    <div>
      <strong>Request sent</strong>
      <p>We will write to {{ done() }} within one working day with your sign-in details.</p>
    </div>
  </div>
} @else {
  <form class="lead" (submit)="submit($event)">
    <div class="pair">
      <div class="f">
        <label [attr.for]="source() + '-name'">Your name</label>
        <input [id]="source() + '-name'" name="name" autocomplete="name" required maxlength="120"
          [ngModel]="name()" (ngModelChange)="name.set($event)" />
      </div>
      <div class="f">
        <label [attr.for]="source() + '-business'">Business name</label>
        <input [id]="source() + '-business'" name="business" autocomplete="organization" required maxlength="160"
          [ngModel]="business()" (ngModelChange)="business.set($event)" />
      </div>
    </div>
    <div class="pair">
      <div class="f">
        <label [attr.for]="source() + '-email'">Work email</label>
        <input [id]="source() + '-email'" name="email" type="email" autocomplete="email" required maxlength="254"
          placeholder="name@company.com" [ngModel]="address()" (ngModelChange)="address.set($event)" />
      </div>
      <!-- Required: we confirm the request and send updates on WhatsApp. -->
      <div class="f">
        <label [attr.for]="source() + '-phone'">WhatsApp number</label>
        <app-phone-input [inputId]="source() + '-phone'" name="phone" [required]="true" [(value)]="phone" />
      </div>
    </div>
    <div class="f">
      <label [attr.for]="source() + '-message'">What will you send? <small>optional</small></label>
      <textarea [id]="source() + '-message'" name="message" rows="3" maxlength="2000"
        placeholder="Fee reminders to 1,200 parents every month"
        [ngModel]="message()" (ngModelChange)="message.set($event)"></textarea>
    </div>
    <!-- Bots fill every box; people never see this one. -->
    <input class="trap" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"
      [ngModel]="website()" (ngModelChange)="website.set($event)" />

    @if (error()) {
      <p class="err" role="alert"><i class="ti ti-alert-triangle" aria-hidden="true"></i>{{ error() }}</p>
    }

    <div class="foot">
      <button class="send" type="submit" [disabled]="busy()">
        {{ busy() ? 'Sending...' : 'Request access' }}
        <i class="ti ti-arrow-right" aria-hidden="true"></i>
      </button>
      <p>We reply within one working day.</p>
    </div>
  </form>
}
