  <noscript>
    <h1>Wuzie: send bulk WhatsApp messages from your own number</h1>
    <p>Reach every customer at once from the WhatsApp number you already use. Each message carries the person's name, goes out at a careful pace that protects your number, and replies come straight back to it.</p>
    <h2>How it works</h2>
    <ul>
      <li>Link your WhatsApp or WhatsApp Business number by scanning a QR code, the same way WhatsApp Web works. There is no Meta approval to wait for.</li>
      <li>Upload your contacts and write one message with each customer's name in it.</li>
      <li>Wuzie sends it with random gaps between messages, spread over the day, and a daily cap for each number.</li>
      <li>Replies arrive on your own WhatsApp number.</li>
    </ul>
    <h2>Who it is for</h2>
    <p>Shops and online brands, schools and coaching classes, clinics and services, and agencies running campaigns for many clients.</p>
    <h2>Questions</h2>
    <h3>How many messages can I send a day?</h3>
    <p>A new number starts with a small daily limit that grows as the number becomes established, up to 1,000 a day per number. Add more numbers to send more.</p>
    <h3>Will my number get banned?</h3>
    <p>No tool can promise that. Wuzie lowers the risk: it caps how much a number sends a day, leaves random gaps between messages and pauses a campaign when too many messages fail.</p>
    <h3>Do I need the WhatsApp Business API?</h3>
    <p>No. You link the number you already use by scanning a QR code.</p>
    <h3>Can I send images, PDFs and buttons?</h3>
    <p>Yes. Text, images, documents and video, plus WhatsApp reply buttons, list menus and carousels your customers tap to answer.</p>
    <h3>How do I get an account?</h3>
    <p>Accounts are set up for you: ask through the Free Access form on this page. Every paid plan starts with a 14-day free trial.</p>
